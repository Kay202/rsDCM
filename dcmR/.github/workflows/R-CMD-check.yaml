# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
#
# Runs R CMD check on a 5-cell matrix:
#   - macOS-latest    R-release
#   - windows-latest  R-release
#   - ubuntu-latest   R-devel
#   - ubuntu-latest   R-release
#   - ubuntu-latest   R-oldrel-1
#
# Two pre-check steps make the workflow self-contained:
#   1. Generates data/toy_dcm.rda from data-raw/ (so the regression test
#      can find the dataset even if the .rda hasn't been committed).
#   2. Runs roxygen2::roxygenise() to populate man/ and refresh NAMESPACE
#      from the source comments (so the check sees up-to-date docs even
#      if devtools::document() wasn't run locally before pushing).
#
# Once you're routinely committing the generated artifacts yourself,
# you can remove those two steps to make CI strictly verify the repo.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::roxygen2
          needs: check

      - name: Generate toy dataset (idempotent)
        run: Rscript data-raw/make-toy-dcm.R
        shell: bash

      - name: Refresh roxygen documentation
        run: Rscript -e "roxygen2::roxygenise()"
        shell: bash

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
          args: 'c("--no-manual","--as-cran")'
